<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image template</title>
<style>
  /* 1200×630 link-preview card. Rendered to /og.png by tools/render-og.mjs; edit HERO_STAT in the script block below. */
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#07080c;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #card{position:relative;width:1200px;height:630px}
  #globe{position:absolute;right:-110px;top:-60px;width:760px;height:760px;opacity:.9}
  .wordmark{position:absolute;left:72px;top:64px;font-size:22px;font-weight:600;letter-spacing:.02em;color:rgba(245,245,247,.72);display:flex;align-items:center;gap:12px}
  .wordmark i{display:inline-block;width:14px;height:14px;border-radius:4px;background:#ece7dc;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
  .title{position:absolute;left:72px;top:118px;font-size:58px;font-weight:700;letter-spacing:-.025em;line-height:1.02}
  .stat{position:absolute;left:72px;top:238px;width:720px;font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1.18;color:#f5f5f7}
  .stat b{font-weight:800;color:#fff}
  .stat em{font-style:normal;color:rgba(245,245,247,.55)}
  .foot{position:absolute;left:72px;bottom:60px;font-size:22px;color:rgba(245,245,247,.6);display:flex;gap:28px;align-items:center}
  .foot .url{color:#f5f5f7;font-weight:600}
  .bricks{position:absolute;left:72px;bottom:118px;display:flex;gap:6px}
  .bricks i{display:block;width:34px;height:14px;border-radius:3px}
</style>
</head>
<body>
<div id="card">
  <!-- faint dot-grid globe silhouette: inline SVG, a circle filled with a dot pattern and a soft rim -->
  <svg id="globe" viewBox="0 0 760 760" aria-hidden="true">
    <defs>
      <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="2.1" fill="#93a3c9"/></pattern>
      <radialGradient id="fade" cx="42%" cy="40%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".75" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <radialGradient id="rim" cx="50%" cy="50%" r="50%"><stop offset=".82" stop-color="#4f7ee8" stop-opacity="0"/><stop offset=".97" stop-color="#4f7ee8" stop-opacity=".35"/><stop offset="1" stop-color="#4f7ee8" stop-opacity="0"/></radialGradient>
      <mask id="m"><circle cx="380" cy="380" r="330" fill="url(#fade)"/></mask>
    </defs>
    <circle cx="380" cy="380" r="330" fill="#0e1322"/>
    <rect width="760" height="760" fill="url(#dots)" mask="url(#m)"/>
    <circle cx="380" cy="380" r="340" fill="url(#rim)"/>
    <!-- a few towers on the silhouette so it reads as the exhibit -->
    <g fill="#ece7dc" opacity=".9">
      <rect x="300" y="250" width="12" height="54" rx="2"/><rect x="330" y="300" width="12" height="36" rx="2"/><rect x="420" y="330" width="12" height="70" rx="2" fill="#d97757"/>
      <rect x="470" y="290" width="12" height="28" rx="2" fill="#4285f4"/><rect x="380" y="430" width="12" height="20" rx="2" fill="#2dd4bf"/><rect x="250" y="400" width="12" height="16" rx="2" fill="#8a8f98"/>
    </g>
  </svg>
  <div class="wordmark"><i></i>whogetstobuildwithai.com</div>
  <div class="title">Who gets to build with AI?</div>
  <div class="stat" id="stat"></div>
  <div class="bricks"><i style="background:#d97757"></i><i style="background:#ece7dc"></i><i style="background:#4285f4"></i><i style="background:#6366f1"></i><i style="background:#2dd4bf"></i><i style="background:#8a8f98"></i></div>
  <div class="foot"><span>Every tower is a country · height is AI usage per person · colour is whose models</span></div>
</div>
<script>
  // TODO: placeholder stat. Replace from sourced data (data/countries.js provenance) once the methodology work lands.
  const HERO_STAT = "A $20 AI subscription costs <b>0.1%</b> of monthly income in Norway <em>and</em> <b>23%</b> in Malawi.";
  document.getElementById("stat").innerHTML = HERO_STAT;
</script>
</body>
</html>
