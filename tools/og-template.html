<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image template</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<style>
  /* 1200×630 link-preview card. Rendered to /og.png by tools/render-og.mjs; edit HERO_STAT in the script block below. */
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#15171c;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #card{position:relative;width:1200px;height:630px}
  #tower{position:absolute;right:-40px;top:-40px;width:720px;height:720px;-webkit-mask:radial-gradient(circle at 50% 50%,#000 0 44%,rgba(0,0,0,.6) 60%,transparent 72%);mask:radial-gradient(circle at 50% 50%,#000 0 44%,rgba(0,0,0,.6) 60%,transparent 72%)}
  #tower img{width:100%;height:100%;object-fit:cover;display:block}
  .wordmark{position:absolute;left:72px;top:64px;font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(245,245,247,.72);display:flex;align-items:center;gap:12px}
  .wordmark i{display:inline-block;width:14px;height:14px;border-radius:4px;background:#ece7dc;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
  .title{position:absolute;left:72px;top:112px;font-family:"Instrument Serif",Georgia,serif;font-size:72px;font-weight:400;letter-spacing:-.01em;line-height:1}
  .title i{color:#efe9d6}
  .stat{position:absolute;left:72px;top:230px;width:700px;font-family:"Instrument Serif",Georgia,serif;font-size:46px;font-weight:400;letter-spacing:0;line-height:1.18;color:#f5f5f7}
  .stat b{font-weight:400;font-style:italic;color:#efe9d6}
  .stat em{font-style:normal;text-decoration:underline;text-decoration-color:rgba(255,255,255,.3);text-underline-offset:6px;text-decoration-thickness:2px}
  .foot{position:absolute;left:72px;bottom:60px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,245,247,.6);display:flex;gap:28px;align-items:center}
  .foot .url{color:#f5f5f7;font-weight:600}
  .bricks{position:absolute;left:72px;bottom:118px;display:flex;gap:6px}
  .bricks i{display:block;width:34px;height:14px;border-radius:3px}
</style>
</head>
<body>
<div id="card">
  <!-- faint dot-grid globe silhouette: inline SVG, a circle filled with a dot pattern and a soft rim -->
  <!-- a real view of the Norway tower, rendered from the exhibit by tools/render-og.mjs (og-tower.png), masked softly into the card -->
  <div id="tower"><img src="og-tower.png" alt=""></div>
  <div class="wordmark"><i></i>whogetstobuildwithai.com</div>
  <div class="title">Who gets to <i>build</i> with AI?</div>
  <div class="stat" id="stat"></div>
  <div class="bricks"><i style="background:#e08a6a"></i><i style="background:#efe9d6"></i><i style="background:#5b8fd6"></i><i style="background:#8e66b8"></i><i style="background:#5cc4ad"></i><i style="background:#a09a8e"></i></div>
  <div class="foot"><span>Every tower is a country · height is AI usage per person · colour is whose models</span></div>
</div>
<script>
  // From data/countries.js (subscriptionShareOfIncome, derived from World Bank GDP per capita); keep in step with HERO_STAT in js/main.js.
  const HERO_STAT = "A $20 AI subscription costs <b>0.3%</b> of monthly income per person in <em>Norway</em> and <b>29.7%</b> in <em>DR Congo</em>.";
  document.getElementById("stat").innerHTML = HERO_STAT;
</script>
</body>
</html>
