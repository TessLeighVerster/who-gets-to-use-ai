<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Who gets to use AI? — one Lego-style brick, white on near-black, matching the site's monochrome style -->
  <rect width="64" height="64" rx="15" fill="#151517"/>
  <!-- studs -->
  <rect x="13" y="13" width="15" height="10" rx="2.5" fill="#d6d6db"/>
  <rect x="36" y="13" width="15" height="10" rx="2.5" fill="#d6d6db"/>
  <rect x="13" y="13" width="15" height="4.5" rx="2" fill="#ffffff"/>
  <rect x="36" y="13" width="15" height="4.5" rx="2" fill="#ffffff"/>
  <!-- brick body with the lower-edge shade the on-screen bricks have -->
  <rect x="7" y="21" width="50" height="31" rx="4.5" fill="#f5f5f7"/>
  <path d="M7 42h50v5.5a4.5 4.5 0 0 1-4.5 4.5h-41A4.5 4.5 0 0 1 7 47.5z" fill="#c7c7cd"/>
